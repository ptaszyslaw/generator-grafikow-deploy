# BEGIN generator-grafikow — wstawia skrypty/wdroz.mjs (repozytorium generator-grafikow), nie edytuj tutaj
# grafik.ptaszynski.pl — Generator grafików (PWA). Wstawiane do .htaccess przez skrypty/wdroz.mjs.
# HTTPS zawsze (service worker i instalacja działają tylko na https); /.well-known bez zmian dla AutoSSL.
RewriteEngine On
RewriteCond %{HTTPS} !=on
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
AddType application/manifest+json .webmanifest
# Aplikacja, manifest i service worker zawsze sprawdzane na serwerze, żeby nowa wersja docierała od razu.
<FilesMatch "^(index\.html|sw\.js|manifest\.webmanifest)$">
  Header set Cache-Control "no-cache"
</FilesMatch>
<FilesMatch "\.png$">
  Header set Cache-Control "public, max-age=604800"
</FilesMatch>
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Options -Indexes
# END generator-grafikow
